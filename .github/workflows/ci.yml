name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run knip
      - run: npm run test -- --coverage
      - run: npm run build
      # postbuild syncs the style hash into vercel.json; it must be committed
      - run: git diff --exit-code vercel.json app/apple-icon.png public/icons
      - run: npm run sizes
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test --project=desktop --project=webkit --project=mobile
      - run: npm run lighthouse
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  visual:
    # macOS for the same system fonts the baselines were recorded with
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install chromium
      - run: npx playwright test --project=visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diffs
          path: test-results
          retention-days: 7
