version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Brussels
    commit-message:
      prefix: "chore(deps)"
    # auto-merge lands minor/patch on green CI; the cooldown is the window in
    # which a bad release can be yanked before it reaches main
    cooldown:
      default-days: 3
    # A dependency joins the first group it matches, so the families come
    # first: they carry no update-types and therefore hold for majors too,
    # which is the point -- a package and its own types/plugins/runner have to
    # move in one PR or the tree does not build. What is left over falls
    # through to minor-and-patch (majors of ungrouped packages get their own
    # PR, as before).
    groups:
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      playwright:
        patterns:
          - "@playwright/test"
          - "playwright"
          - "@axe-core/playwright"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      next:
        patterns:
          - "next"
          - "@next/*"
          - "eslint-config-next"
      commitlint:
        patterns:
          - "@commitlint/*"
      testing-library:
        patterns:
          - "@testing-library/*"
      ajv:
        patterns:
          - "ajv"
          - "ajv-formats"
      biome:
        patterns:
          - "@biomejs/*"
      minor-and-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Brussels
    commit-message:
      prefix: "chore(ci)"
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 3
